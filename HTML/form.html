<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="" method="POST">
      <label for="name">Name:</label>
      <input
        type="text"
        value=""
        placeholder="Please input your name here"
        name="in_name"
        required
      />
      <label for="Email">Email:</label>
      <input
        type="email"
        value=""
        placeholder="Please input your email here"
        name="in_email"
        required
      />
      <fieldset>
        <legend>Plan</legend>
        <label
          ><input type="radio" name="plan" value="basic" checked /> Basic</label
        >
        <label><input type="radio" name="plan" value="pro" /> Pro</label>
      </fieldset>

      <fieldset>
        <legend>Interests</legend>
        <label
          ><input type="checkbox" name="interests" value="html" /> HTML</label
        >
        <label
          ><input type="checkbox" name="interests" value="css" /> CSS</label
        >
      </fieldset>

      <label for="country">Country</label>
      <select id="country" name="country" required>
        <option value="">-- Select your country --</option>
        <option>Philippines</option>
        <option>Japan</option>
        <option>Canada</option>
        <option>Italy</option>
      </select>

      <input type="submit" value="Submit" name="s_button" />
      <button type="reset">Reset</button>
    </form>
  </body>
</html>
